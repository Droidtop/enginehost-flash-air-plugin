name: Android plugin

on:
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Bundle pinned Ruffle runtime and licenses
        run: |
          mkdir -p enginehost-android/app/src/main/assets/ruffle .ci
          curl --fail --location --retry 5 --output .ci/ruffle.zip https://github.com/ruffle-rs/ruffle/releases/download/v0.4.1/ruffle-0.4.1-web-selfhosted.zip
          unzip -q .ci/ruffle.zip -d enginehost-android/app/src/main/assets/ruffle
          cp LICENSE.md enginehost-android/app/src/main/assets/ruffle/LICENSE.md
          test -f enginehost-android/app/src/main/assets/ruffle/ruffle.js
          test -n "$(find enginehost-android/app/src/main/assets/ruffle -name '*.wasm' -print -quit)"
      - name: Build plugin APK
        run: gradle -p enginehost-android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify plugin APK
        run: |
          APK=enginehost-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q dev.enginehost.plugin.RUN
          unzip -l "$APK" | grep -q assets/ruffle/ruffle.js
          unzip -l "$APK" | grep -q assets/ruffle/LICENSE.md
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-flash-air-debug-apk
          path: enginehost-android/app/build/outputs/apk/debug/app-debug.apk
