name: Build Enginehost bundle

on:
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Droidtop/enginehost
          ref: codex/engine-bundles
          path: enginehost-tooling
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore pinned Ruffle runtime and licenses
        run: |
          mkdir -p build/payload/runtime/ruffle .ci
          curl --fail --location --retry 5 --output .ci/ruffle.zip https://github.com/ruffle-rs/ruffle/releases/download/v0.4.1/ruffle-0.4.1-web-selfhosted.zip
          unzip -q .ci/ruffle.zip -d build/payload/runtime/ruffle
          cp LICENSE.md build/payload/runtime/ruffle/LICENSE.md
          test -f build/payload/runtime/ruffle/ruffle.js
          test -n "$(find build/payload/runtime/ruffle -name '*.wasm' -print -quit)"
      - name: Build wrapper library
        run: gradle -p enginehost-android :app:assembleRelease --no-daemon --stacktrace
      - name: Build signed Enginehost bundle
        env:
          ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}
        run: |
          test -n "$ENGINEHOST_SIGNING_KEY_PEM"
          mkdir -p build/output
          unzip -p enginehost-android/app/build/outputs/aar/app-release.aar classes.jar > build/classes.jar
          "$ANDROID_HOME/build-tools/36.0.0/d8" --release --min-api 26 --output build/payload build/classes.jar
          printf '%s' "$ENGINEHOST_SIGNING_KEY_PEM" > build/signing-key.pem
          python3 enginehost-tooling/scripts/build-engine-bundle.py \
            --metadata enginehost/bundle-metadata.json --payload build/payload \
            --private-key build/signing-key.pem \
            --repository-key-document enginehost-public-key.json \
            --output build/output/dev.enginehost.flashair.ruffle041.v1.enginehost.tar.xz \
            --release-envelope build/output/enginehost-release.json \
            --public-key-document build/output/enginehost-public-key.json
          cmp enginehost-public-key.json build/output/enginehost-public-key.json
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-flash-air-ruffle-0.4.1-v1
          path: build/output/*
